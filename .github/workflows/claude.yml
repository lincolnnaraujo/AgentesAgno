name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Prevent multiple Claude runs at the same time to avoid rate limit errors
concurrency:
  group: claude-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false  # Queue instead of cancel, so no request is lost

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent runaway jobs from consuming API quota
    permissions:
      contents: write        # Required for Claude to commit changes
      pull-requests: write   # Required for Claude to comment on PRs
      issues: write          # Required for Claude to comment on issues
      id-token: write
      actions: read          # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # ⚠️  IMPORTANT: Make sure ANTHROPIC_API_KEY is set in:
          #   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
          #   The key must be from console.anthropic.com (the workspace that has your $5 credit).
          #   The Anthropic Pro plan (claude.ai) is SEPARATE from API credits.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # No hardcoded prompt here — Claude will respond to whatever @claude was asked in the comment.
          # Uncomment and edit the line below only if you want to force a specific task on every run:
          # prompt: "Review this pull request for code quality, correctness, and security."

          claude_args: |
            --max-turns 3
            --model claude-haiku-4-5-20251001